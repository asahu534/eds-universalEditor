name: Publish Notify

# AEM fires these repository_dispatch events on publish/unpublish (see
# https://www.aem.live/developer/github-actions). They call our deployed
# App Builder `publish-notifier` action, which posts the Teams card.
on:
  repository_dispatch:
    types:
      - resource-published
      - resource-published-native
      - resource-unpublished
      - resource-unpublished-native

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Teams via App Builder action
        env:
          # Values come straight from the AEM event payload.
          PUBLISH_PATH: ${{ github.event.client_payload.path }}
          PUBLISHER: ${{ github.event.client_payload.user }}
          EVENT_TYPE: ${{ github.event.action }}
          ACTION_URL: https://291222-edsuniversaleditor-stage.adobeioruntime.net/api/v1/web/appbuilder/publish-notifier
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
        run: |
          body=$(jq -n \
            --arg path "$PUBLISH_PATH" \
            --arg user "$PUBLISHER" \
            --arg action "$EVENT_TYPE" \
            '{path: $path, user: $user, action: $action, priority: "normal"}')
          curl -sS -X POST "$ACTION_URL" \
            -H "content-type: application/json" \
            -H "x-api-key: $SERVICE_API_KEY" \
            -d "$body" \
            -w "\nHTTP %{http_code}\n"
