application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      appbuilder:
        license: Apache-2.0
        actions:
          team-proxy:
            function: actions/generic/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              SERVICE_API_KEY: $SERVICE_API_KEY
            annotations:
              require-adobe-auth: false
              final: true

          form-submit:
            function: actions/form-submit/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              CRM_API_TOKEN: $CRM_API_TOKEN
            annotations:
              require-adobe-auth: false
              final: true

          publish-notifier:
            function: actions/publish-events/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              SLACK_WEBHOOK_URL: $SLACK_WEBHOOK_URL
            annotations:
              require-adobe-auth: true
              final: true
